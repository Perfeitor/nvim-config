name: Sync main to language branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git signing
        env:
          SIGNING_KEY: ${{ secrets.GIT_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/github_actions_signing
          chmod 600 ~/.ssh/github_actions_signing

          git config user.name "Perfeitor"
          git config user.email "EMAIL_GITHUB_CUA_ONG"

          git config gpg.format ssh
          git config user.signingkey ~/.ssh/github_actions_signing
          git config commit.gpgsign true

      - name: Sync main to language branches
        run: |
          git fetch origin

          for branch in $(git branch -r --format='%(refname:short)' | grep '^origin/lang/'); do
            branch=${branch#origin/}

            echo "Syncing main -> $branch"

            git checkout "$branch"

            if git merge origin/main --no-edit; then
              git push origin "$branch"
              echo "✓ $branch synced"
            else
              echo "✗ Conflict in $branch"
              git merge --abort
            fi
          done